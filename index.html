            if (search.indexOf('igsh=') !== -1 || search.indexOf('fbclid=') !== -1 || search.indexOf('line=') !== -1) {

                window.history.replaceState({}, document.title, cleanUrl);

    <!-- Google Fonts: Bodoni Moda & Noto Serif Thai -->

    <style>
        /* Global Font Settings */
        body { font-family: 'Bodoni Moda', 'Noto Serif Thai', serif; scroll-behavior: smooth; background-color: #FFFCFB; }
        .font-heading { font-family: 'Bodoni Moda', 'Noto Serif Thai', serif; }
        .font-script { font-family: 'Bodoni Moda', 'Noto Serif Thai', serif; font-style: italic; }
        
        /* Animations */
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(176, 117, 88, 0.3); } 50% { box-shadow: 0 0 0 20px rgba(176, 117, 88, 0); } }
        
        .animate-fade-in-down { animation: fadeInDown 1s ease-out forwards; }
        .animate-fade-in-up { animation: fadeInUp 1s ease-out forwards; }
        .animate-pulse-glow { animation: pulse-glow 2.5s infinite; }

        /* ✨ Rose Gold Sparkle Effect ✨ */
        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 8px 1px rgba(176, 117, 88, 0.4); }
        }
        .sparkle { position: absolute; background-color: #FFF; border-radius: 50%; animation: twinkle linear infinite; pointer-events: none; z-index: 110; }

        /* --- 🎬 IMAGE SLIDING DOORS REVEAL 🎬 --- */
        .door-panel { position: absolute; top: 0; width: 50%; height: 100%; z-index: 100; will-change: transform; transition: transform 1.5s cubic-bezier(0.77, 0, 0.175, 1) 0.5s; overflow: hidden; background-color: #4A3C35; }
        .door-panel::before { content: ''; position: absolute; top: 0; width: 100vw; height: 100%; background-image: url('https://wsrv.nl/?url=https://i.ibb.co/mr2BHdvd/LMT-4283.jpg&w=2000&output=webp&q=85'); background-size: cover; background-position: center 15%; background-repeat: no-repeat; }
        .door-left::before { left: 0; }
        .door-right::before { right: 0; }
        .door-panel::after { content: ''; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.2); }
        .door-left { left: 0; border-right: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 5px 0 20px rgba(0, 0, 0, 0.3); }
        .door-right { right: 0; border-left: 1px solid rgba(255, 255, 255, 0.3); box-shadow: -5px 0 20px rgba(0, 0, 0, 0.3); }
        .door-left-open { transform: translateX(-105%); }
        .door-right-open { transform: translateX(105%); }

        .cover-content { transition: all 0.8s ease-in-out; z-index: 120; }
        .cover-content-hidden { opacity: 0; transform: scale(1.1) translateY(-20px); pointer-events: none; }

        /* Wax Seal Style */
        .wax-seal { background: radial-gradient(circle at 30% 30%, #c43835 0%, #8e1e1c 45%, #5a1110 100%); box-shadow: 0 10px 25px rgba(142, 30, 28, 0.4), inset 0 2px 5px rgba(255,255,255,0.4), inset 0 -3px 8px rgba(0,0,0,0.3); border: 2px solid #FFF; }
        .wax-seal-inner { background: radial-gradient(circle at 50% 50%, #8e1e1c 0%, #5a1110 100%); box-shadow: inset 0 2px 4px rgba(90, 17, 16, 0.6), 0 1px 2px rgba(255,255,255,0.2); border: 1px dashed rgba(255, 255, 255, 0.4); }

        /* --- Reveal Animations --- */
        .reveal { opacity: 0; transform: translateY(40px); transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1); will-change: opacity, transform; }
        .reveal-scale { opacity: 0; transform: scale(0.95) translateY(30px); transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1); will-change: opacity, transform; }
        .reveal.active, .reveal-scale.active { opacity: 1; transform: translateY(0) scale(1); }

        /* Music Bars */
        .bar { width: 2px; height: 10px; background: #B07558; display: inline-block; margin: 0 1px; animation: equalize 1s infinite; transform-origin: bottom; }
        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.4s; }
        @keyframes equalize { 0% { height: 3px; } 50% { height: 10px; } 100% { height: 3px; } }

        /* Scrollbar hiding */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

        const CheckCircle2 = ({ size = 24, className = "" }) => ( <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10Z" /><path d="m9 12 2 2 4-4" /></svg> );
        const Instagram = ({ size = 24, className = "", strokeWidth = 1.5 }) => ( <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg> );

        function Countdown() {
            const [timeLeft, setTimeLeft] = React.useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
            React.useEffect(() => {
                const targetDate = new Date('2026-07-03T15:00:00').getTime();
                const interval = setInterval(() => {
                    const now = new Date().getTime();
                    const difference = targetDate - now;
                    if (difference > 0) {
                        setTimeLeft({
                            days: Math.floor(difference / (1000 * 60 * 60 * 24)),
                            hours: Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                            minutes: Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60)),
                            seconds: Math.floor((difference % (1000 * 60)) / 1000)
                        });
                    } else clearInterval(interval);
                }, 1000);
                return () => clearInterval(interval);
            }, []);
            return (
                <div className="flex justify-center gap-4 md:gap-8 mt-10 animate-fade-in-up">
                    {['Days', 'Hours', 'Mins', 'Secs'].map((label, idx) => (
                        <div key={label} className="flex flex-col items-center">
                            <div className="w-14 h-14 md:w-18 md:h-18 bg-[#FFFCFB]/80 backdrop-blur-md rounded-2xl flex items-center justify-center border border-[#B07558]/20 text-xl md:text-2xl font-heading font-semibold text-[#8e1e1c] shadow-lg">
                                {Object.values(timeLeft)[idx]}
                            </div>
                            <span className="text-[10px] uppercase tracking-widest text-[#8e1e1c] mt-2 font-bold">{label}</span>
                        </div>
                    ))}
                </div>
            );
        }

        const SparklesEffect = () => {
            const sparkles = Array.from({ length: 40 }).map((_, i) => ({ 
                id: i, 
                left: `${Math.random() * 100}%`, 
                top: `${Math.random() * 100}%`,
                duration: `${Math.random() * 2 + 1.5}s`, 
                delay: `${Math.random() * 3}s`, 
                size: `${Math.random() * 3 + 2}px` 
            }));
            return (
                <div className="absolute inset-0 overflow-hidden pointer-events-none z-[110]">
                    {sparkles.map((s) => (
                        <div key={s.id} className="sparkle" style={{ left: s.left, top: s.top, width: s.size, height: s.size, animationDuration: s.duration, animationDelay: s.delay }}></div>
                    ))}
                </div>
            );
        };

        function App() {
            const [envelopeState, setEnvelopeState] = React.useState('sealed');
            const [isPlaying, setIsPlaying] = React.useState(false);
            const [isPlayerReady, setIsPlayerReady] = React.useState(false);
            const playerRef = React.useRef(null);
            
            // ข้อมูลสำหรับฟอร์ม RSVP
            const [formData, setFormData] = React.useState({ name: '', attending: 'yes', guests: '1', companionNames: '', dietary: '', message: '' });
            const [isSubmitted, setIsSubmitted] = React.useState(false);
            const [isLoading, setIsLoading] = React.useState(false);
            
            const [qrImageError, setQrImageError] = React.useState(false);
            const rsvpRef = React.useRef(null);
            const [showDressCodeModal, setShowDressCodeModal] = React.useState(false);
            const [selectedGalleryImg, setSelectedGalleryImg] = React.useState(null);

            const scrollToRSVP = () => {
                rsvpRef.current?.scrollIntoView({ behavior: 'smooth' });
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            // ✅ ฟังก์ชันส่งข้อมูลด้วย Fetch API (ไม่มีการใช้ google.script.run แล้ว)
            const handleSubmit = (e) => {
                e.preventDefault();
                setIsLoading(true);

                // นำ URL ปลายทางของ Google Apps Script ของคุณมาใส่ตรงนี้
                const scriptURL = 'https://script.google.com/macros/s/AKfycbwZMN93MHv6VZxIM59kOIkItNYWW20BAN9cUhbICDb1899kMx0wX1NSCWFmBbOdW2uTkw/exec';
                
                // แปลงข้อมูลให้อยู่ในรูปแบบ URL Encoded เพื่อให้ส่งข้ามโดเมนได้ไม่ติด CORS
                const formBody = new URLSearchParams(formData).toString();

                fetch(scriptURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formBody
                })
                .then(response => response.json())
                .then(data => {
                    setIsSubmitted(true);
                    setIsLoading(false);
                })
                .catch(error => {
                    console.error('Submit Error:', error.message);
                    // ทริกเกอร์ success เป็น Fallback ไว้ เพราะบางกรณีส่งข้อมูลติดแล้วแต่ติดเรื่อง CORS return response
                    setIsSubmitted(true);
                    setIsLoading(false);
                });
            };

            React.useEffect(() => {
                const initYTPlayer = () => {
                    playerRef.current = new window.YT.Player('youtube-player', {
                        height: '200', width: '200',
                        videoId: 'WPO-X6X2jrQ', 
                        playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': 'WPO-X6X2jrQ', 'playsinline': 1, 'showinfo': 0, 'rel': 0, 'enablejsapi': 1, 'origin': window.location.origin },
                        events: { 
                            'onReady': () => setIsPlayerReady(true), 
                            'onStateChange': (e) => setIsPlaying(e.data === window.YT.PlayerState.PLAYING) 
                        }
                    });
                };
                if (!window.YT) {
                    const tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api";
                    const firstScriptTag = document.getElementsByTagName('script')[0]; firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                    window.onYouTubeIframeAPIReady = initYTPlayer;
                } else if (!playerRef.current) initYTPlayer();
            }, []);

            React.useEffect(() => {
                if (envelopeState !== 'opened') return;
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('active'); });
                }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });
                document.querySelectorAll('.reveal, .reveal-scale').forEach((el) => observer.observe(el));
                
                const handleScroll = () => {
                    const heroBg = document.getElementById('hero-parallax-bg');
                    if (heroBg) heroBg.style.transform = `translateY(${window.scrollY * 0.4}px)`;
                };
                window.addEventListener('scroll', handleScroll, { passive: true });
                return () => { observer.disconnect(); window.removeEventListener('scroll', handleScroll); };
            }, [envelopeState]);

            const openEnvelope = () => {
                setEnvelopeState('opening');
                try {
                    if (isPlayerReady && playerRef.current && typeof playerRef.current.playVideo === 'function') {
                        playerRef.current.unMute();
                        playerRef.current.setVolume(100);
                        playerRef.current.playVideo();
                    }
                } catch (err) {
                    console.error("Music play error:", err);
                }
                setTimeout(() => setEnvelopeState('opened'), 2500); 
            };

            const toggleMusic = () => {
                if (playerRef.current && isPlayerReady) {
                    isPlaying ? playerRef.current.pauseVideo() : playerRef.current.playVideo();
                }
            };

            const timelineEvents = [
                { time: '3:09 PM', title: 'Vow Ceremony', detail: 'กล่าวคำมั่นสัญญาระหว่างคู่บ่าวสาว', icon: <UserRound size={22} /> },
                { time: '4:00 PM', title: 'Cocktails', detail: 'เครื่องดื่มและอาหารว่าง', icon: <GlassWater size={22} /> },
                { time: '4:30 PM', title: 'Wedding Photos', detail: 'บันทึกภาพที่ระลึกร่วมกับคู่บ่าวสาว', icon: <Camera size={22} /> },
                { time: '5:00 PM', title: 'Bouquet Toss', detail: 'พิธีโยนช่อดอกไม้', icon: <Flower2 size={22} /> },
                { time: '5:30 PM', title: 'Dinner', detail: 'ร่วมรับประทานอาหารอาหารค่ำ (โต๊ะไทย)', icon: <Utensils size={22} /> },
            ];

            return (
                <div className={`relative ${envelopeState !== 'opened' ? 'h-screen overflow-hidden bg-[#FFFCFB]' : ''}`}>
                    <div className="absolute top-[-9999px] left-[-9999px] opacity-0 pointer-events-none z-[-1]"><div id="youtube-player"></div></div>

                    {envelopeState !== 'opened' && (
                        <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center pointer-events-none bg-[#FFFCFB]">
                            <div className={`door-panel door-left pointer-events-auto ${envelopeState === 'opening' ? 'door-left-open' : ''}`}></div>
                            <div className={`door-panel door-right pointer-events-auto ${envelopeState === 'opening' ? 'door-right-open' : ''}`}></div>

                            {envelopeState === 'sealed' && <SparklesEffect />}

                            <div className={`relative z-[120] flex flex-col items-center justify-center cover-content pointer-events-auto w-full px-4 ${envelopeState === 'opening' ? 'cover-content-hidden' : ''}`}>
                                
                                <div className="relative mb-6 mt-12">
                                    <div className="absolute inset-0 bg-white/40 blur-2xl rounded-full"></div>
                                    <img src="https://i.ibb.co/HTdj8HX6/Screenshot-1-removebg-preview.png" alt="Logo" className="relative w-32 md:w-44 h-auto drop-shadow-[0_5px_15px_rgba(176,117,88,0.2)] mx-auto" />
                                </div>
                                
                                <p className="font-serif text-[10px] md:text-xs tracking-[0.4em] uppercase text-[#8e1e1c] mb-2 drop-shadow-sm text-center w-full">Cordially Invited</p>
                                <p className="font-script text-3xl md:text-4xl text-[#8e1e1c] mb-8 drop-shadow-sm text-center w-full">To Our Wedding</p>
